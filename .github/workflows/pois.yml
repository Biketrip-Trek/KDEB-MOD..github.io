# =====================================================================
# Robot POI : GitHub lance outils/pois_auto.py sur ses serveurs (qui ont
# accès à OpenStreetMap), puis enregistre le résultat dans data/pois/.
#   - à chaque publication d'une trace ou d'une fiche ;
#   - toutes les 30 minutes (à h + 17 et h + 47), pour finir ce qui est resté en
#     attente quand les serveurs OpenStreetMap étaient saturés ;
#   - à la main : onglet Actions > Robot POI > Run workflow.
# Le détail de chaque passage (tranches, serveurs, erreurs) est visible
# dans l'onglet Actions, en « annotations ».
# =====================================================================
name: Robot POI

on:
  push:
    branches: [main]
    paths:
      - "gpx/**"
      - "data/*.js"
      - "outils/pois_auto.py"
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

# Un seul passage à la fois ; un passage en attente reprend la dernière version du site
concurrency:
  group: robot-poi
  cancel-in-progress: false

jobs:
  pois:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Chercher les POI des fiches qui en demandent
        run: python3 outils/pois_auto.py | tee bilan.txt

      - name: Enregistrer les POI sur le site
        run: |
          git config user.name "Robot POI"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/pois
          if git diff --cached --quiet; then
            echo "Aucun changement de POI."
          else
            git commit -m "POI automatiques (OpenStreetMap)" -m "$(grep -v '^::' bilan.txt | tail -20)"
            git pull --rebase origin main
            git push origin main
          fi
