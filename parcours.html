<!doctype html>
<!--
=======================================================================
 FICHIER : parcours.html  =  MODÈLE DE PAGE commun à TOUS les parcours
 Il n'y a qu'un seul fichier pour tous les parcours : l'adresse indique
 lequel afficher. Exemple : parcours.html?p=dolce-via
 assets/parcours.js lit alors data/dolce-via.js et remplit les "boîtes"
 vides ci-dessous (repérées par leur id="...").

 Pour changer l'ORDRE des sections de la page : déplace un bloc entier,
 depuis sa ligne <h2 class="section"> jusqu'à la ligne avant le <h2>
 suivant. Exemple : le carnet du jour est volontairement en dernier.
=======================================================================
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcours</title>  <!-- remplacé automatiquement par le nom du parcours -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/leaflet/leaflet.css">
<!-- VERSION DES FICHIERS : le "?v=..." force les navigateurs à recharger le style et les
     scripts après une mise à jour. Change ce numéro (ex. la date du jour) quand tu modifies
     style.css ou un fichier .js du dossier assets, ici ET dans l'autre page HTML. -->
<link rel="stylesheet" href="assets/style.css?v=20261021c">
</head>
<body>

<!-- L'en-tête (logo + menus) est ajouté ici automatiquement par assets/entete.js -->

<!-- ===== BANDEAU : photo principale, étiquettes, titre, résumé ===== -->
<section class="hero">
  <div class="fond" id="fond"></div>
  <div class="contenu">
    <div class="etiquettes-lieu" id="lieu"></div>
    <h1 id="titre"></h1>
    <p class="chapeau" id="chapeau"></p>
  </div>
</section>

<!-- ===== BARRE DE CHIFFRES (distance, D+, durée...) ===== -->
<section class="stats"><div class="contenu" id="stats"></div></section>

<main class="contenu">

  <!-- ===== PHOTOS ===== -->
  <h2 class="section" id="photos-titre">Photos</h2>
  <div class="galerie" id="galerie"></div>

  <!-- ===== CARTE, PROFIL, TÉLÉCHARGEMENTS ===== -->
  <h2 class="section" id="carte-titre">Carte, profil et points d'intérêt</h2>
  <div class="bloc-carte">
    <div class="filtres" id="filtres"></div>         <!-- boutons de filtre des points d'intérêt -->
    <p class="note-poi" id="note-poi" hidden></p>     <!-- « points d'intérêt en cours de recherche » (robot POI) -->
    <div id="carte"></div>                           <!-- la carte -->
    <div class="profil">                             <!-- le profil altimétrique -->
      <div class="infobulle" id="info"></div>
      <svg id="profil" viewBox="0 0 1000 160" preserveAspectRatio="none"></svg>
      <div class="reperes" id="reperes"></div>
    </div>
    <div class="telecharger">                        <!-- boutons de téléchargement -->
      <a class="btn" id="gpx" download><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>Trace GPX</a>
      <button class="btn clair" id="gpx-poi"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>GPX avec points d'intérêt</button>
    </div>
  </div>

  <!-- ===== L'ESSENTIEL (encarts pratiques) ===== -->
  <h2 class="section" id="essentiel-titre">L'essentiel</h2>
  <div class="encarts" id="encarts"></div>

  <!-- ===== FEUILLE DE ROUTE (points d'intérêt par km) ===== -->
  <h2 class="section" id="feuille-titre">Feuille de route</h2>
  <div class="feuille" id="feuille-bloc"><table><thead><tr><th>Km</th><th>Type</th><th>Lieu</th><th>Détail</th></tr></thead><tbody id="feuille"></tbody></table></div>

  <!-- ===== ÉTAPES (une ligne par jour) ===== -->
  <h2 class="section" id="etapes-titre">Étapes</h2>
  <div class="defile" id="etapes-bloc"><table class="etapes"><thead><tr><th>Jour</th><th>Trajet</th><th>Km</th><th>D+</th><th>Notes</th></tr></thead><tbody id="etapes"></tbody></table></div>

  <!-- ===== LE CARNET DU JOUR (volontairement en fin de page) =====
       Une page de carnet par étape, avec le ressenti du jour ("ressenti"
       dans les étapes de la fiche). Section masquée si aucun ressenti. -->
  <h2 class="section" id="carnet-titre">Le carnet du jour</h2>
  <div class="carnet" id="carnet"></div>

  <!-- ===== RETOUR (fiches courtes « Traces du Nord » seulement) ===== -->
  <p class="retour" id="retour" hidden></p>

  <!-- ===== CRÉDITS ===== -->
  <p class="credits" id="credits"></p>
</main>

<!-- Le pied de page est ajouté automatiquement par assets/entete.js
     (ses liens se modifient dans PIED_DE_PAGE, en haut de ce fichier). -->

<!-- Visionneuse : photo en grand, flèches précédente / suivante, légende, compteur.
     Cachée tant qu'on ne clique pas sur une photo de la galerie. -->
<div class="loupe" id="loupe" role="dialog" aria-label="Photo en grand">
  <button class="loupe-fermer" id="loupe-fermer" aria-label="Fermer">×</button>
  <button class="loupe-fleche gauche" id="loupe-prec" aria-label="Photo précédente">‹</button>
  <figure>
    <img id="loupe-img" alt="">
    <figcaption><span id="loupe-legende"></span><span class="mono" id="loupe-compteur"></span></figcaption>
  </figure>
  <button class="loupe-fleche droite" id="loupe-suiv" aria-label="Photo suivante">›</button>
</div>

<!-- Programmes de la page : carte (Leaflet), en-tête commun, construction de la page -->
<script src="assets/leaflet/leaflet.js"></script>
<script src="assets/entete.js?v=20261021c"></script>
<script src="assets/parcours.js?v=20261021c"></script>
</body>
</html>
